name: Scientific archive checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify analytical relations and definitive YAMLs
        run: python -m unittest discover -s tests -v
      - name: Check YAML syntax of reconstructed examples
        run: python -m compileall -q modelos scripts tests analysis machine_learning

# The CI never accesses Planck/BICEP/Keck data or triggers expensive inference.
# Full LFS objects and numerical samplers are intentionally excluded.
