debug: false

packages_path: /home/ivan.fierro__yachaytech.edu.ec/fran/packages

theory:
  classy:
    stop_at_error: false
    extra_args:
      Pk_ini_type: analytic_Pk
      modes: s,t
      output: tCl pCl lCl
      k_pivot: 0.05
      lensing: true
      l_max_scalars: 2700
      l_max_tensors: 600

params:
  N_star:
    prior:
      min: 50
      max: 60
    ref: 55
    proposal: 0.5
    drop: true
    latex: N_*

  n_s:
    value: "lambda N_star: 1.0 - 6.0*(3.0/(4.0*N_star**2)) + 2.0*(-1.0/N_star)"
    latex: n_s

  r:
    value: "lambda N_star: 12.0/N_star**2"
    latex: r

  alpha_s:
    value: 0.0
    latex: \alpha_s

  A_s:
    prior:
      min: 1.8e-9
      max: 3.0e-9
    ref: 2.1e-9
    proposal: 1.0e-10
    latex: A_s

  H0:
    prior:
      min: 60
      max: 75
    ref: 67.5
    proposal: 1.0
    latex: H_0

  omega_b:
    prior:
      min: 0.020
      max: 0.024
    ref: 0.0224
    proposal: 0.0002
    latex: \omega_b

  omega_cdm:
    prior:
      min: 0.10
      max: 0.14
    ref: 0.12
    proposal: 0.002
    latex: \omega_{\rm cdm}

  tau_reio:
    prior:
      min: 0.04
      max: 0.08
    ref: 0.055
    proposal: 0.005
    latex: \tau_{\rm reio}

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE_lite_native: null

  bicep_keck_2018:
    path: /home/ivan.fierro__yachaytech.edu.ec/fran/packages/data/bicep_keck_2018

sampler:
  mcmc:
    burn_in: 0.3
    learn_proposal: true
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    max_tries: 8000

output: /home/ivan.fierro__yachaytech.edu.ec/fran/chains_mcmc_SR1_CORREGIDO/mcmc_starobinsky_SR1_CORREGIDO
