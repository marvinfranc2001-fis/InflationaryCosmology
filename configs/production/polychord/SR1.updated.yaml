params:
  N_star:
    prior:
      min: 50
      max: 60
    ref: 55
    drop: true
  n_s:
    value: 'lambda N_star: 1.0 - 2.0/N_star - 4.5/N_star**2'
    derived: true
    renames:
    - ns
  r:
    value: 'lambda N_star: 12.0/N_star**2'
    derived: true
  alpha_s:
    value: 0.0
    renames:
    - nrun
  A_s:
    prior:
      min: 1.8e-09
      max: 3.0e-09
    ref: 2.1e-09
    renames:
    - As
  H0:
    prior:
      min: 60
      max: 75
    ref: 67.5
  omega_b:
    prior:
      min: 0.02
      max: 0.024
    ref: 0.0224
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.12
    renames:
    - omegach2
  tau_reio:
    prior:
      min: 0.04
      max: 0.08
    ref: 0.055
    renames:
    - tau
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_\mathrm{cal}
