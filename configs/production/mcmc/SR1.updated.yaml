params:
  N_star:
    prior:
      min: 50
      max: 60
    ref: 55
    proposal: 0.5
    drop: true
    latex: N_*
  n_s:
    value: 'lambda N_star: 1.0 - 6.0*(3.0/(4.0*N_star**2)) + 2.0*(-1.0/N_star)'
